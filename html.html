<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>خطة الهجرة + ASP.NET Core + Points Calculator</title>
  <style>
    body{font-family:Arial,'Cairo',sans-serif;background:#f4f6f9;margin:24px;color:#111827}
    h1,h2{color:#2c3e50;text-align:center}
    .card{background:#fff;border:1px solid #d1d5db;border-radius:14px;padding:18px;margin:14px 0}
    .btn{padding:6px 10px;border-radius:8px;cursor:pointer}
    .note{background:#fff;border:1px solid #d1d5db;border-radius:6px;min-height:30px}
    table{width:100%;border-collapse:collapse;margin:10px 0}
    th,td{border:1px solid #d1d5db;padding:8px;text-align:center}
    th{background:#4F81BD;color:#fff}
    .section-title{margin-top:30px}
    .points-bar{position:relative;height:14px;background:#e5e7eb;border-radius:999px;overflow:hidden}
    .points-bar span{position:absolute;left:0;top:0;height:100%;width:0;transition:width .3s ease}
  </style>
</head>
<body>
  <h1>خطة الهجرة + خطة الدراسة + حاسبة النقاط</h1>

  <!-- ===== Points Calculator ===== -->
  <h2 class="section-title">🧮 آلة حساب النقاط للهجرة الماهرة</h2>
  <div class="card">
    <form id="pointsForm" oninput="calcPoints()">
      <label>العمر:
        <select id="age">
          <option value="0">اختر</option>
          <option value="30">25–32 (30)</option>
          <option value="25">33–39 (25)</option>
          <option value="15">40–44 (15)</option>
        </select>
      </label><br/><br/>
      <label>اللغة الإنجليزية:
        <select id="english">
          <option value="0">اختر</option>
          <option value="20">Superior (20)</option>
          <option value="10">Proficient (10)</option>
          <option value="0">Competent (0)</option>
        </select>
      </label><br/><br/>
      <label>المؤهل:
        <select id="degree">
          <option value="0">اختر</option>
          <option value="20">دكتوراه (20)</option>
          <option value="15">ماجستير/بكالوريوس (15)</option>
          <option value="10">دبلوم (10)</option>
        </select>
      </label><br/><br/>
      <label>خبرة خارج أستراليا:
        <select id="expOut">
          <option value="0">0–2 (0)</option>
          <option value="5">3–4 (5)</option>
          <option value="10">5–7 (10)</option>
          <option value="15">8+ (15)</option>
        </select>
      </label><br/><br/>
      <label>خبرة داخل أستراليا:
        <select id="expIn">
          <option value="0">0</option>
          <option value="5">1–2 (5)</option>
          <option value="10">3–4 (10)</option>
          <option value="15">5–7 (15)</option>
          <option value="20">8+ (20)</option>
        </select>
      </label><br/><br/>
      <label>ترشيح:
        <select id="state">
          <option value="0">لا</option>
          <option value="5">190 (+5)</option>
          <option value="15">491 (+15)</option>
        </select>
      </label><br/><br/>
      <label>🎯 الهدف:
        <input id="targetPoints" type="number" value="80" min="65" max="100" style="width:70px">
      </label>
    </form>

    <h3>إجمالي: <span id="pointsTotal">0</span> نقطة</h3>
    <div style="display:flex;align-items:center;gap:10px">
      <div id="pointsBadge" style="min-width:90px;text-align:center;font-weight:bold;background:#eee;padding:4px 8px;border-radius:999px">Low</div>
      <div class="points-bar"><span id="pointsFill"></span></div>
    </div>
    <div id="pointsMsg" style="margin-top:8px;font-weight:bold"></div>
    <div style="margin-top:10px">
      <b>الفجوة:</b> <span id="pointsGap">0</span> نقطة
      <div><b>اقتراحات:</b><ul id="improvementList"></ul></div>
      <div><b>الخطة A:</b><ul id="planList"></ul></div>
    </div>
  </div>

  <script>
    function setGauge(total){
      const pct = Math.min(100,total);
      const fill=document.getElementById('pointsFill');
      const badge=document.getElementById('pointsBadge');
      fill.style.width=pct+'%';
      if(total<65){fill.style.background='#ef4444';badge.textContent='Low';}
      else if(total<80){fill.style.background='#f59e0b';badge.textContent='Medium';}
      else{fill.style.background='#10b981';badge.textContent='High';}
    }
    function buildImprovements(){
      const eng=parseInt(english.value)||0,deg=parseInt(degree.value)||0;
      const expOut=parseInt(expOutEl.value)||0,expIn=parseInt(expInEl.value)||0,state=parseInt(stateEl.value)||0;
      const items=[];
      if(eng<20) items.push({label:`رفع الإنجليزي (إلى Superior) +${20-eng}`,delta:20-eng});
      if(state<15){if(state===0){items.push({label:`ترشيح 491 (+15)`,delta:15});items.push({label:`ترشيح 190 (+5)`,delta:5});}
      else if(state===5){items.push({label:`التحويل من 190→491 (+10)`,delta:10});}}
      if(expOut<15){items.push({label:`زيادة خبرة خارج أستراليا`,delta:15-expOut});}
      if(expIn<20){items.push({label:`زيادة خبرة داخل أستراليا`,delta:20-expIn});}
      if(deg<20){items.push({label:`ترقية مؤهل (مثلا ماجستير/دكتوراه)`,delta:20-deg});}
      return items.sort((a,b)=>b.delta-a.delta);
    }
    function greedyPlan(gap,items){const chosen=[];let sum=0;
      for(const it of items){if(sum>=gap)break;chosen.push(it);sum+=it.delta;}return {chosen,covered:sum};}
    function calcPoints(){
      const age=parseInt(ageEl.value)||0,eng=parseInt(english.value)||0,deg=parseInt(degree.value)||0;
      const expOut=parseInt(expOutEl.value)||0,expIn=parseInt(expInEl.value)||0,state=parseInt(stateEl.value)||0;
      const target=parseInt(targetPoints.value)||80;
      const total=age+eng+deg+expOut+expIn+state;
      pointsTotal.textContent=total;setGauge(total);
      const gap=Math.max(0,target-total);pointsGap.textContent=gap;
      if(total>=80)pointsMsg.textContent="✅ ممتاز: فرص الدعوة قوية.";
      else if(total>=65)pointsMsg.textContent="🟡 مؤهل مبدئيًا (65+).";
      else pointsMsg.textContent="🔴 أقل من 65.";
      const items=buildImprovements();improvementList.innerHTML='';items.forEach(it=>{let li=document.createElement('li');li.textContent=it.label;improvementList.appendChild(li);});
      const plan=greedyPlan(gap,items);planList.innerHTML='';if(gap===0){let li=document.createElement('li');li.textContent="لا تحتاج تحسين.";planList.appendChild(li);}
      else plan.chosen.forEach(it=>{let li=document.createElement('li');li.textContent=it.label;planList.appendChild(li);});
    }
    const ageEl=age,english=document.getElementById('english'),degree=document.getElementById('degree');
    const expOutEl=document.getElementById('expOut'),expInEl=document.getElementById('expIn'),stateEl=document.getElementById('state'),targetPoints=document.getElementById('targetPoints');
    const pointsTotal=document.getElementById('pointsTotal'),pointsGap=document.getElementById('pointsGap'),pointsMsg=document.getElementById('pointsMsg'),pointsFill=document.getElementById('pointsFill'),pointsBadge=document.getElementById('pointsBadge');
    const improvementList=document.getElementById('improvementList'),planList=document.getElementById('planList');
    calcPoints();
  </script>
</body>
</html>
